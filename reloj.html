<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body{
    height:100%;
    margin:0;
}

body{
    background:
        radial-gradient(circle, rgba(0,255,255,.16) 1px, transparent 1px),
        linear-gradient(135deg, #061b20, #123f46);
    background-size:8px 8px, cover;
    color:white;
    font-family:'Segoe UI', Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
}

.widget{
    position:relative;
    width:360px;
    height:260px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.circulo{
    position:relative;
    width:230px;
    height:230px;
}

svg{
    width:230px;
    height:230px;
    transform:rotate(-90deg);
}

.base{
    fill:none;
    stroke:rgba(255,255,255,.16);
    stroke-width:6;
}

.base2{
    fill:none;
    stroke:rgba(255,255,255,.08);
    stroke-width:2;
}

.progreso{
    fill:none;
    stroke:#18e8e8;
    stroke-width:6;
    stroke-linecap:round;
    filter:drop-shadow(0 0 8px #18e8e8);
    transition:stroke-dashoffset .25s linear;
}

.punto{
    fill:white;
    filter:drop-shadow(0 0 6px white);
}

.contenido{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.dia{
    font-size:13px;
    font-weight:500;
    opacity:.85;
    margin-bottom:2px;
}

.fecha{
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
}

.hora{
    font-size:42px;
    font-weight:800;
    letter-spacing:1px;
    line-height:1;
}

.zona{
    font-size:10px;
    letter-spacing:2px;
    opacity:.65;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="widget">
    <div class="circulo">
        <svg viewBox="0 0 230 230">
            <circle class="base2" cx="115" cy="115" r="88"></circle>
            <circle class="base" cx="115" cy="115" r="100"></circle>
            <circle class="progreso" id="progreso" cx="115" cy="115" r="100"></circle>
            <circle class="punto" id="punto" cx="115" cy="15" r="5"></circle>
        </svg>

        <div class="contenido">
            <div class="dia" id="dia"></div>
            <div class="fecha" id="fecha"></div>
            <div class="hora" id="hora"></div>
            <div class="zona">HORA LOCAL</div>
        </div>
    </div>
</div>

<script>
const dias = [
    "Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"
];

const meses = [
    "Ene","Feb","Mar","Abr","May","Jun",
    "Jul","Ago","Sep","Oct","Nov","Dic"
];

const radio = 100;
const centro = 115;
const circunferencia = 2 * Math.PI * radio;

const progreso = document.getElementById("progreso");
progreso.style.strokeDasharray = circunferencia;

function actualizarHora(){
    const ahora = new Date();

    const segundos = ahora.getSeconds();
    const avance = segundos / 60;

    progreso.style.strokeDashoffset = circunferencia - avance * circunferencia;

    const angulo = avance * 360 - 90;
    const radianes = angulo * Math.PI / 180;

    const x = centro + radio * Math.cos(radianes);
    const y = centro + radio * Math.sin(radianes);

    document.getElementById("punto").setAttribute("cx", x);
    document.getElementById("punto").setAttribute("cy", y);

    document.getElementById("dia").innerHTML = dias[ahora.getDay()];
    document.getElementById("fecha").innerHTML =
        meses[ahora.getMonth()] + " " + String(ahora.getDate()).padStart(2,'0');

    document.getElementById("hora").innerHTML =
        String(ahora.getHours()).padStart(2,'0') + ":" +
        String(ahora.getMinutes()).padStart(2,'0') + ":" +
        String(ahora.getSeconds()).padStart(2,'0');
}

setInterval(actualizarHora,1000);
actualizarHora();
</script>

</body>
</html>
