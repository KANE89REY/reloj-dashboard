<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

html, body{
    height:100%;
    margin:0;
}

body{
    color:white;
    font-family:'Segoe UI', sans-serif;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    width:100%;
    box-sizing:border-box;
}

.contenedor{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.fecha{
    font-size:14px;
    font-weight:500;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:8px;
    opacity:.9;
}

.hora{
    font-size:58px;
    font-weight:300;
    line-height:1;
    letter-spacing:2px;
}

</style>
</head>

<body>

<div class="contenedor">
    <div class="fecha" id="fecha"></div>
    <div class="hora" id="hora"></div>
</div>

<script>

function actualizarHora(){

    const ahora = new Date();

        String(ahora.getDate()).padStart(2,'0') + " / " +
        String(ahora.getMonth()+1).padStart(2,'0') + " / " +
        ahora.getFullYear();

    const hora =
        String(ahora.getHours()).padStart(2,'0') + ":" +
        String(ahora.getMinutes()).padStart(2,'0') + ":" +

actualizarHora();

</body>
</html>
