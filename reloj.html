<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

html, body{
    height:100%;
    margin:0;
}

body{
    background:#144147;
    color:white;
    font-family:Arial;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    width:100%;
    box-sizing:border-box;
}

.contenedor{
    text-align:center;
    width:100%;
}

.fecha{
    font-size:25px;
    font-weight:bold;
    margin-bottom:10px;
}

.hora{
    font-size:25px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="contenedor">
    <div class="fecha" id="fecha"></div>
    <div class="hora" id="hora"></div>
</div>

function actualizarHora(){

const meses = [
"enero","febrero","marzo","abril","mayo","junio",

];

</body>
</html>
