<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Dashboard - MEJORADO</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(circle, rgba(0,255,255,.14) 1px, transparent 1px),
                #0b162a;
            background-size: 8px 8px;
            background-attachment: fixed;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 100vh;
        }

        .contenedor {
            text-align: center;
            padding: 20px;
        }

        .reloj {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .fecha {
            font-size: clamp(14px, 3vw, 18px);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .dia-semana {
            font-size: clamp(14px, 2.5vw, 16px);
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0.7;
            color: rgba(0, 255, 255, 0.8);
        }

        .separador {
            width: 2px;
            height: clamp(30px, 8vw, 38px);
            background: rgba(255, 255, 255, 0.35);
            border-radius: 2px;
        }

        .hora {
            font-size: clamp(32px, 8vw, 48px);
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.45);
            font-family: 'Courier New', monospace;
        }

        .pulso {
            width: 10px;
            height: 10px;
            background: #18e8e8;
            border-radius: 50%;
            box-shadow: 0 0 10px #18e8e8;
            animation: pulse 1s infinite;
            flex-shrink: 0;
        }

        .zona-horaria {
            font-size: clamp(12px, 2vw, 14px);
            opacity: 0.6;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.45;
            }
            50% {
                transform: scale(1.25);
                opacity: 1;
            }
            100% {
                transform: scale(0.8);
                opacity: 0.45;
            }
        }

        /* Responsive para dispositivos muy pequeños */
        @media (max-width: 480px) {
            .separador {
                height: 30px;
                margin: 0 10px;
            }

            .reloj {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <div class="reloj">
            <div class="fecha" id="fecha" aria-label="Fecha actual"></div>
            <div class="separador" aria-hidden="true"></div>
            <div class="hora" id="hora" aria-label="Hora actual" aria-live="polite"></div>
            <div class="pulso" aria-hidden="true"></div>
        </div>
        <div class="dia-semana" id="diaSemana" aria-label="Día de la semana"></div>
        <div class="zona-horaria" id="zonaHoraria"></div>
    </div>

    <script>
        // Constantes
        const MESES = [
            "Ene", "Feb", "Mar", "Abr", "May", "Jun",
            "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"
        ];

        const DIAS_SEMANA = [
            "Domingo", "Lunes", "Martes", "Miércoles",
            "Jueves", "Viernes", "Sábado"
        ];

        // Cachear elementos del DOM
        const elementoFecha = document.getElementById("fecha");
        const elementoHora = document.getElementById("hora");
        const elementoDiaSemana = document.getElementById("diaSemana");
        const elementoZonaHoraria = document.getElementById("zonaHoraria");

        function actualizarHora() {
            const ahora = new Date();

            // Actualizar fecha
            const fecha = String(ahora.getDate()).padStart(2, '0') + " " +
                         MESES[ahora.getMonth()].toUpperCase();
            elementoFecha.textContent = fecha;

            // Actualizar día de semana
            const diaSemana = DIAS_SEMANA[ahora.getDay()];
            elementoDiaSemana.textContent = diaSemana;

            // Actualizar hora
            const hora = String(ahora.getHours()).padStart(2, '0') + ":" +
                        String(ahora.getMinutes()).padStart(2, '0') + ":" +
                        String(ahora.getSeconds()).padStart(2, '0');
            elementoHora.textContent = hora;

            // Actualizar zona horaria
            const zonaHoraria = ahora.toLocaleString('es-ES', { timeZoneName: 'short' }).split(' ').pop();
            elementoZonaHoraria.textContent = `Zona: ${zonaHoraria}`;
        }

        // Ejecutar inmediatamente
        actualizarHora();

        // Actualizar cada segundo
        setInterval(actualizarHora, 1000);
    </script>
</body>
</html>
